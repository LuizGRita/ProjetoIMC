<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
      .container{
         display: grid;
         grid-template-columns: 1fr 1fr;
         grid-template-areas: 
            "header header"
            "formulario tabela";
         gap: 20px;
         max-width: 1200px;
         margin: 0 auto;
         padding: 20px;
      }
      header {
         grid-area: header;
         text-align: center;
      }
      .tabela {
         grid-area: tabela;
      }
      .formulario {
         grid-area: formulario;
      }
   </style>
</head>
<body>
   <div class="container">
      <header>
         <h1>IMC</h1>
      </header>
         <div class="tabela">
            <table>
               <caption>Pessoas Cadastradas</caption>
               <thead>
                  <tr>
                     <th onclick="ordenarPor('nome')">Nome</th>
                     <th onclick="ordenarPor('altura')">Altura</th>
                     <th onclick="ordenarPor('massa')">Massa</th>
                     <th onclick="ordenarPor('IMC')">IMC</th>
                     <th>Status</th>
                     <th>Opções</th>
                  </tr>
               </thead>
               <tbody>
               </tbody>
            </table>
         </div>
         <div class="formulario">
            <form action="">
               <h2>Cadastrar</h2>
               <div>
                  <label for="nome">Nome</label>
                  <input type="text" placeholder="Digite seu nome:" id="nome">
               </div>
               <div>
                  <label for="altura">Altura</label>
                  <input type="number" step="0.01" id="altura" placeholder="Altura em metros:">
               </div>
               <div>
                  <label for="massa">Massa</label>
                  <input type="number" step="0.01" id="massa" placeholder="Massa em kg:">
               </div>
               <div>
               <button type="submit">Cadastrar</button>
               </div>
            </form>
         </div>
   </div>
   <script src="code.js"></script>
</body>
</html>
